}

}

  height: 20px;

  &lt;script&gt;
    (()=&gt;{
      const root=document.getElementById(&#x27;diffusion-sac-vis&#x27;);let stage=0;
      const stages=[
        [&#x27;读取环境状态&#x27;,&#x27;输入包含 UAV 电量/位置/负载/类型、3×3 需求网格、候选任务和 mobility bounds。&#x27;,&#x27;s = {state[130], mobility_bounds[16]}&#x27;],
        [&#x27;提取紧凑特征&#x27;,&#x27;SFCFeaturesExtractor 把结构化 Dict observation 编码为 core features，并保留方向 bounds。&#x27;,&#x27;f = encoder(s)&#x27;],
        [&#x27;扩散生成动作&#x27;,&#x27;Actor 从高斯动作噪声开始，执行 20 步反向去噪，输出 mobility 与逐 VNF placement logits。&#x27;,&#x27;aₜ₋₁ = DDIM(aₜ, εθ(f,aₜ,t))&#x27;],
        [&#x27;应用动作约束&#x27;,&#x27;ray mask 按电量、边界和避碰方向缩放 mobility；placement logits 保持连续。&#x27;,&#x27;a = mask(a₀, mobility_bounds)&#x27;],
        [&#x27;双 Critic 评价&#x27;,&#x27;两个 Q 网络估计状态—动作价值，训练和 QNE 都使用较保守的 min(Q₁,Q₂)。&#x27;,&#x27;Q(s,a) = min(Q₁,Q₂)&#x27;],
        [&#x27;QNE 选择噪声&#x27;,&#x27;对同一状态采样 32 个候选噪声，Q 标准化后按温度 softmax；温度越低越集中。&#x27;,&#x27;wᵢ = softmax(zscore(Qᵢ)/τ)&#x27;],
        [&#x27;更新网络&#x27;,&#x27;候选噪声加权和成为 Actor 的监督目标；Critic 用 TD target 更新，target Critic 用 Polyak 平滑。&#x27;,&#x27;ε* = Σwᵢεᵢ ; Lactor = MSE(εθ,ε*)&#x27;]
      ];
      const list=root.querySelector(&#x27;#algo-stage-list&#x27;);stages.forEach((s,i)=&gt;{const d=document.createElement(&#x27;div&#x27;);d.className=&#x27;stage-item&#x27;;d.innerHTML=`&lt;span class=&quot;num&quot;&gt;${i+1}&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;${s[0]}&lt;/span&gt;`;d.addEventListener(&#x27;click&#x27;,()=&gt;{stage=i;render();});list.appendChild(d);});
      function samples(){const t=Number(root.querySelector(&#x27;#algo-temp&#x27;).value);const vals=Array.from({length:32},(_,i)=&gt;Math.exp((Math.sin(i*1.7)+Math.cos(i*.43)*.55)/t));const sum=vals.reduce((a,b)=&gt;a+b,0);const ws=vals.map(v=&gt;v/sum),max=Math.max(...ws),best=ws.indexOf(max);const box=root.querySelector(&#x27;#algo-samples&#x27;);box.innerHTML=ws.map((w,i)=&gt;`&lt;span class=&quot;sample ${i===best?&#x27;best&#x27;:&#x27;&#x27;}&quot; style=&quot;--q:${Math.max(8,w/max*100)}%&quot; aria-label=&quot;候选 ${i+1}，权重 ${(w*100).toFixed(1)}%&quot;&gt;&lt;/span&gt;`).join(&#x27;&#x27;);}
      function render(){root.querySelector(&#x27;#algo-stage-badge&#x27;).textContent=`阶段 ${stage+1}/7`;root.querySelector(&#x27;#algo-stage-title&#x27;).textContent=stages[stage][0];root.querySelector(&#x27;#algo-stage-text&#x27;).textContent=stages[stage][1];root.querySelector(&#x27;#algo-formula&#x27;).innerHTML=`&lt;code&gt;${stages[stage][2]}&lt;/code&gt;`;root.querySelectorAll(&#x27;[data-node]&#x27;).forEach((g,i)=&gt;g.querySelector(&#x27;.node&#x27;).classList.toggle(&#x27;active&#x27;,i===stage));root.querySelectorAll(&#x27;[data-edge]&#x27;).forEach((e,i)=&gt;e.classList.toggle(&#x27;active&#x27;,i===stage-1));[...list.children].forEach((d,i)=&gt;d.classList.toggle(&#x27;active&#x27;,i===stage));root.querySelector(&#x27;#algo-samples-wrap&#x27;).hidden=stage!==5;root.querySelector(&#x27;#algo-prev&#x27;).disabled=stage===0;root.querySelector(&#x27;#algo-next&#x27;).disabled=stage===6;samples();}
      root.querySelector(&#x27;#algo-prev&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{stage=Math.max(0,stage-1);render();});root.querySelector(&#x27;#algo-next&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{stage=Math.min(6,stage+1);render();});root.querySelector(&#x27;#algo-temp&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{root.querySelector(&#x27;#algo-temp-value&#x27;).textContent=Number(e.target.value).toFixed(2);samples();});root.querySelector(&#x27;#algo-mask&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{root.querySelector(&#x27;#algo-action-sub&#x27;).textContent=e.target.checked?&#x27;ray mask 后 104D&#x27;:&#x27;未约束 104D&#x27;;});render();
    })();
