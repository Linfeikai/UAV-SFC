# @package _global_
# Diffusion mobility + learned relational categorical placement.
hybrid_categorical_placement: true
relational_placement: true
placement_prior_scale: 0.0

warmup_steps: 5000
bc_pretrain_steps: 2000
bc_batch_size: 256
n_envs: 8
checkpoint_freq: 20000

diffusion:
  batch_size: 512
  gradient_steps: 1
  qne_k_samples: 8
  # Placement stays anchored to expert CE; QNE optimizes Diffusion mobility.
  categorical_q_coef: 0.0
  categorical_bc_coef: 1.0
  categorical_bc_batch_size: 128
