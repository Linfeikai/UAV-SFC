# Heterogeneous environment for learned categorical VNF placement.
UAV_TYPES:
  - gpu
  - general
  - gpu
  - general
NON_GPU_SLOWDOWN: 4.0
USE_HARD_CAP: false
APPLY_MOBILITY_MASK_IN_ENV: false

# Per-VNF, per-UAV effective demand enables hard categorical masks.
EXPOSE_PLACEMENT_CONTEXT: true

# Do not overwrite learned choices with the old structured decoder.
PLACEMENT_AFFINITY_BIAS: 0.0
PLACEMENT_LOAD_BIAS: 0.0
PLACEMENT_DISTANCE_BIAS: 0.0
